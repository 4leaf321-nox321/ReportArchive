name: Build release bundle

# Two trigger paths:
#   - push a `v*` tag → builds and attaches the .tar.gz to a GitHub Release
#   - manual "Run workflow" button → builds and uploads as a workflow artifact
#     (no Release created — useful for dry-runs or ad-hoc dev bundles)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # required to publish Release assets

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install apptainer (via official PPA)
        # apptainer isn't in Ubuntu noble's default repos — pull it from
        # the upstream PPA so the version matches what production runs.
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apptainer

      - name: Build bundle (deploy/build_bundle.sh)
        # GHA's `runner` user has no subuid/subgid mappings, so apptainer
        # build can't run unprivileged. The script honors this env var by
        # prefixing the build with sudo.
        env:
          USE_SUDO_APPTAINER: '1'
        run: ./deploy/build_bundle.sh

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reportarchive-bundle
          path: release/*.tar.gz
          retention-days: 30

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
